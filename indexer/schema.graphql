enum EventStatus {
  logged
  disputed
  released
  rejected
}

enum EventKind {
  impression
  click
}

type Campaign {
  id: ID!
  advertiser: String! @index
  claimsHash: String!
  priceImpression: BigInt!
  priceClick: BigInt!
  budget: BigInt!
  # Sum of released event prices, gross of the protocol fee
  spent: BigInt!
  # Sum of rejected event prices, returned to the budget
  refunded: BigInt!
  withdrawn: BigInt!
  events: [ClearingEvent!]! @derivedFrom(field: "campaign")
}

type ClearingEvent {
  # eventId
  id: ID!
  requestId: String!
  campaign: Campaign!
  publisher: Publisher!
  kind: EventKind!
  price: BigInt!
  status: EventStatus! @index
  # True once the advertiser disputed it, kept after settlement
  wasDisputed: Boolean!
  paid: Boolean!
  # Protocol fee taken from the price; null until paid or deferred
  fee: BigInt
  # Block timestamps, seconds
  loggedAt: Int! @index
  loggedTx: String!
  settledAt: Int
  settledTx: String
  paidTx: String
}

type Publisher {
  # Checksummed address
  id: ID!
  impressions: Int!
  clicks: Int!
  # Each event sits in exactly one of these four buckets, by its current status
  pending: Int!
  disputed: Int!
  released: Int!
  rejected: Int!
  # USDC (6 decimals) transferred to the publisher, net of fee: PaidOut plus Claimed
  earned: BigInt!
  # released / (released + rejected + disputed) in basis points; null until an event is settled or disputed
  trustScoreBps: Int
  lastActivityAt: Int!
  events: [ClearingEvent!]! @derivedFrom(field: "publisher")
}

type Protocol {
  # Singleton, id "aria"
  id: ID!
  # Sum of fees taken from paid and deferred events
  feesAccrued: BigInt!
  feesWithdrawn: BigInt!
}
